name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Run Invariant & Sanity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python scripts/dev.py lint

      - name: Types
        run: python scripts/dev.py types

      - name: Guard
        run: python scripts/dev.py guard

      - name: Unit tests
        run: pytest tests/unit tests/integration -v

      - name: phase0 red baseline
        run: python scripts/dev.py phase0-check
